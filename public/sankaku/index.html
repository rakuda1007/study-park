    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6d4fc7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Study Park" />
    <title>いろいろな三角形の性質 | Study Park</title>
    <base href="/sankaku/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="stylesheet" href="/shared/quiz-header.css?v=16" />
    <link rel="stylesheet" href="/sankaku/style.css?v=6" />
  </head>
  <body>
    <header class="app-header app-header--unified">
      <a href="/" class="app-header-logo-link" aria-label="トップへ">
        <img
          class="app-header-logo"
          src="/study-park-logo.png?v=8"
          alt=""
          width="48"
          height="48"
        />
      </a>
      <h1 class="app-header-title">いろいろな三角形の性質</h1>
    </header>

    <main class="lesson-main">
      <p class="lesson-intro">
        三角形には、いろいろな性質があります。ここでは図を見ながら、ひとつずつまとめていきます。
      </p>

      <nav class="lesson-toc" aria-label="このページの目次">
        <p class="lesson-toc-title">もくじ</p>
        <ol class="lesson-toc-list">
          <li><a href="#section-1">三角形の内角と外角</a></li>
        </ol>
      </nav>

      <article id="section-1" class="lesson-section" aria-labelledby="heading-1">
        <h2 id="heading-1">1. 三角形の内角と外角</h2>

        <figure class="lesson-figure" aria-labelledby="fig-triangle-caption">
          <svg
            viewBox="0 0 400 260"
            role="img"
            aria-labelledby="fig-triangle-title fig-triangle-caption"
          >
            <title id="fig-triangle-title">三角形ABCの内角と外角</title>

            <!-- 辺BCの延長 -->
            <line
              x1="40"
              y1="210"
              x2="398"
              y2="210"
              stroke="#64748b"
              stroke-width="1.5"
            />

            <!-- 三角形 -->
            <polygon
              points="140,48 40,210 296,210"
              fill="none"
              stroke="#334155"
              stroke-width="2.5"
              stroke-linejoin="round"
            />

            <!-- 内角 A（㋐） -->
            <path
              d="M 121.1 78.6 A 36 36 0 0 0 165.0 73.9"
              fill="none"
              stroke="#334155"
              stroke-width="2"
              stroke-linecap="round"
            />
            <text x="148.5" y="97.3" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">
              ㋐
            </text>

            <!-- 内角 B（㋑） -->
            <path
              d="M 58.9 179.4 A 36 36 0 0 1 76.0 210.0"
              fill="none"
              stroke="#334155"
              stroke-width="2"
              stroke-linecap="round"
            />
            <text x="85.5" y="189.3" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">
              ㋑
            </text>

            <!-- 内角・外角 C（㋒・㋓）連続円弧 -->
            <path
              d="M 260 210 A 36 36 0 0 1 271 184.1 A 36 36 0 0 1 332 210"
              fill="none"
              stroke="#334155"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <text x="249.5" y="191.7" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">
              ㋒
            </text>
            <text x="315.5" y="167.5" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">
              ㋓
            </text>

            <!-- 頂点ラベル -->
            <text x="140" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">
              A
            </text>
            <text x="24" y="228" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">
              B
            </text>
            <text x="308" y="228" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">
              C
            </text>

            <text x="360" y="224" font-size="11" fill="#64748b">延長</text>
          </svg>
          <figcaption id="fig-triangle-caption" class="lesson-figure-caption">
            ㋐・㋑・㋒は<strong>内角</strong>、㋓は辺BCをのばしたときの<strong>外角</strong>
          </figcaption>
        </figure>

        <p class="lesson-body">
          3つの頂点が A, B, C である三角形 ABC があります。
          ㋐・㋑・㋒のように、三角形の<strong>内側</strong>にある角を、三角形の
          <strong>内角</strong>
          といいます。
        </p>
        <p class="lesson-body">
          辺 BC をのばしたときにできる、㋓のような角を
          <strong>外角</strong>
          といいます。外角は、頂点 C のそばで、辺 BC とその延長のあいだにできます。
        </p>
      </article>
    </main>

  </body>
</html>
