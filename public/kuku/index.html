<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5058B8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Study Park" />
    <title>九九パーク | Study Park</title>
    <base href="/kuku/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="stylesheet" href="/kuku/style.css" />
  </head>
  <body>
    <div class="zone-top">
      <header class="app-header">
        <h1 class="app-title">
          <a href="/" class="app-title-link">九九パーク</a>
        </h1>
        <div class="header-actions">
          <span id="levelPill" class="level-pill" aria-live="polite">Lv.1</span>
          <select id="modeSelect" class="mode-select" aria-label="出題モード">
            <option value="sequential">順番（1×1〜9×9）</option>
            <option value="random">ランダム</option>
            <option value="weak">苦手問題</option>
            <option value="timed">タイムアタック（100秒・全81問）</option>
          </select>
          <a class="btn-home" href="/">トップ</a>
          <button type="button" id="btnQuit" class="btn-quit">やめる</button>
          <button type="button" id="btnCharPick" class="btn-ghost">キャラ</button>
        </div>
      </header>

      <div id="timedBar" class="timed-bar" hidden aria-live="polite">
        <div class="timed-bar-row">
          <span class="timed-label">⏱ 残り</span>
          <strong id="timedRemainSec" class="timed-sec">100</strong>
          <span class="timed-unit">秒</span>
          <span id="timedBestPill" class="timed-best-pill" hidden></span>
        </div>
        <div class="timed-progress-track" aria-hidden="true">
          <div id="timedProgressFill" class="timed-progress-fill"></div>
        </div>
      </div>

      <section id="characterPanel" class="character-panel" aria-live="polite">
        <div id="speech" class="speech-bubble">はじめよう！</div>
        <div class="char-stage-block">
          <div class="fx-layer" aria-hidden="true">
            <div class="fx-stars" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span>
            </div>
          </div>
          <div class="char-stage">
            <img id="charImg" src="/orange.png" alt="みかんぼうや" />
          </div>
          <p id="charLabel" class="char-name">🍊 みかんぼうや</p>
        </div>
      </section>
    </div>

    <div class="zone-input">
      <section id="problemCard" class="problem-card">
        <p id="problemText" class="problem-text" aria-live="polite">1 × 1 = ?</p>
      </section>

      <div class="numpad" role="group" aria-label="数字パッド">
        <button type="button" class="digit" id="d1">1</button>
        <button type="button" class="digit" id="d2">2</button>
        <button type="button" class="digit" id="d3">3</button>
        <button type="button" class="digit" id="d4">4</button>
        <button type="button" class="digit" id="d5">5</button>
        <button type="button" class="digit" id="d6">6</button>
        <button type="button" class="digit" id="d7">7</button>
        <button type="button" class="digit" id="d8">8</button>
        <button type="button" class="digit" id="d9">9</button>
        <button type="button" class="btn-wide btn-clear" id="btnClear">けす</button>
        <button type="button" class="digit" id="d0">0</button>
        <button type="button" class="btn-wide btn-submit" id="btnSubmit">OK</button>
      </div>

      <footer class="footer-stats">
        <span>連続せいかい <strong id="streak">0</strong></span>
        <span>のこり <strong id="remain">81 / 81</strong></span>
      </footer>
    </div>

    <div id="levelBanner" class="levelup-banner" role="status" aria-live="assertive"></div>

    <div id="timedModal" class="modal-backdrop timed-modal" hidden>
      <div class="timed-modal-card" id="timedModalCard" role="dialog" aria-modal="true">
        <p id="timedModalTitle" class="timed-modal-title"></p>
        <p id="timedModalMsg" class="timed-modal-msg"></p>
        <img
          id="timedModalImg"
          class="timed-modal-img"
          src="/characters.png"
          alt="みんなでお祝い"
          hidden
        />
        <p id="timedModalTime" class="timed-modal-time"></p>
        <div class="timed-modal-actions">
          <button type="button" id="btnTimedRetry" class="btn-secondary" hidden>
            もういちど
          </button>
          <button type="button" id="btnTimedModalClose" class="btn-primary">やったね！</button>
        </div>
      </div>
    </div>

    <div id="charModal" class="modal-backdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="charModalTitle">
        <h2 id="charModalTitle">キャラをえらぶ</h2>
        <p style="margin: 0 0 10px; font-size: 0.88rem; color: var(--muted)">
          おまかせにすると、レベルが上がるたびにキャラがかわるよ（最初はみかんぼうや）。<br />
          つづきはこのスマホ・パソコンの中に保存されます（クラウドには送りません）。
        </p>
        <div id="charGrid" class="char-grid"></div>
        <div class="modal-actions">
          <button type="button" id="btnAutoChar" class="btn-secondary">おまかせ（レベルでかわる）</button>
          <button type="button" id="btnModalClose" class="btn-primary">とじる</button>
        </div>
      </div>
    </div>

    <script src="/kuku/characters.js"></script>
    <script src="/kuku/storage.js"></script>
    <script src="/kuku/app.js"></script>
    <script src="/pwa-update.js"></script>
  </body>
</html>
